# Declarative package manifests consumed by run_onchange_ scripts.
# Adding/removing entries here triggers reinstall on next `chezmoi apply`
# because the rendered scripts hash changes.

packages:
  darwin:
    taps:
      - anomalyco/tap
    brews:
      # Core CLI
      - git
      - bat
      - btop
      - python
      # Shell plugins (also provided as git externals where needed)
      - zsh-completions
      # Modern CLI replacements
      - eza           # ls replacement
      - fzf           # fuzzy finder
      - zoxide        # smarter cd
      - atuin         # shell history search
      - lazygit       # git TUI
      - git-delta     # git diff pager
      - broot         # tree navigator
      - direnv        # per-dir env
      - mise          # runtime version manager
      - forgit        # fzf + git
      - starship      # prompt
      - anomalyco/tap/opencode  # AI coding agent
    casks:
      - wezterm
      - 1password
      - 1password-cli
      - gpg-suite
      - marta
      - opencode-desktop
      - orbstack
      - slack
      - time-out
      - zed
    fonts:
      - font-caskaydia-cove-nerd-font
      - font-caskaydia-mono-nerd-font
      - font-fira-code-nerd-font
      - font-inter
      - font-jetbrains-mono-nerd-font
      - font-noto-nerd-font

  windows:
    # Populated in Phase 8; stubbed here so scripts can iterate safely.
    scoop_buckets:
      - extras
      - nerd-fonts
      - versions
    scoop:
      - git
      - neovim
      - bat
      - btop
      - nodejs
      - bun
      - python
      - eza
      - fzf
      - zoxide
      - atuin
      - lazygit
      - delta
      - broot
      - direnv
      - mise
      - starship
      - opencode
      - ripgrep
      - fd
      - tree-sitter
      - curl
    fonts:
      - CaskaydiaCove-NF
      - CaskaydiaMono-NF
      - FiraCode-NF
      - JetBrainsMono-NF
      - Noto-NF
    winget:
      - { id: AgileBits.1Password, name: 1Password }
      - { id: GnuPG.Gpg4win, name: Gpg4win }
      - { id: Kong.Insomnia, name: Insomnia }
      - { id: JetBrains.Toolbox, name: JetBrains Toolbox }
      - { id: ProtonTechnologies.ProtonVPN, name: ProtonVPN }
      - { id: SIL.Inter, name: Inter }
      - { id: SlackTechnologies.Slack, name: Slack }
    scoop_gui:
      - 1password-cli
      - flutter
      - wezterm
      - zed
    powershell_modules:
      - Terminal-Icons
      - PSFzf
      - PSReadLine
